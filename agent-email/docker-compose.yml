services:
  agent-email:
    build: .
    container_name: agent-email
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./onedrive_token_cache.json:/app/onedrive_token_cache.json
      # Nur nötig, wenn STORAGE_PROVIDER=local in .env gesetzt ist.
      # Format ist immer <echter NAS-Pfad>:<Pfad innerhalb des Containers>.
      # Linke Seite (NAS-Pfad) an eure echte Freigabe anpassen. Rechte Seite
      # ("/data") ist der Wert, der in LOCAL_STORAGE_PATH in .env gehört -
      # dort NIEMALS die linke (NAS-)Seite eintragen, siehe Kommentar in
      # .env.example.
      #
      # WICHTIG: Immer einen eigenen, dedizierten Freigabeordner mounten,
      # NIEMALS eine bestehende, umfassendere Freigabe (z.B. ein allgemeines
      # "Daten"-Verzeichnis mit privaten/sonstigen Dateien) - der Container
      # läuft aktuell als root und hat vollen Lese-/Schreib-/Löschzugriff
      # auf ALLES, was hier gemountet wird. Ein zu weit gefasster Mount kann
      # nicht durch Datei-/Ordner-Berechtigungen eingeschränkt werden, da
      # root diese ohnehin umgeht.
      - /volume1/Agent:/data

  # Nur nötig, wenn CLASSIFIER_PROVIDER=local in .env gesetzt ist.
  # Nach dem ersten Start Modell laden:
  #   docker exec -it ollama ollama pull qwen2.5:1.5b
  ollama:
    # Gepinnt statt :latest, damit ein Rebuild nicht unbemerkt eine neue
    # Ollama-Version zieht, die sich anders verhält. Version bei Bedarf
    # bewusst hochziehen und neu testen.
    image: ollama/ollama:0.32.5
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
